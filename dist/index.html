  <script>
    // Android WebView first-start race: prevent known transient Google triggerEvent crash from blanking screen.
    (function () {
      function isKnownTransientError(message) {
        return typeof message === 'string' && message.indexOf("reading 'triggerEvent'") !== -1;
      }
      window.addEventListener('error', function (event) {
        var msg = String((event && event.message) || '');
        if (isKnownTransientError(msg)) {
          console.warn('[BootstrapGuard] suppressed transient triggerEvent error:', msg);
          event.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function (event) {
        var msg = String((event && event.reason && (event.reason.message || event.reason)) || '');
        if (isKnownTransientError(msg)) {
          console.warn('[BootstrapGuard] suppressed transient triggerEvent rejection:', msg);
          event.preventDefault();
        }
      });
      window.onerror = function (message) {
        var msg = String(message || '');
        if (isKnownTransientError(msg)) {
          console.warn('[BootstrapGuard] window.onerror suppressed:', msg);
          return true;
        }
        return false;
      };
    })();
  </script>
  
  
  <!-- 화면 방향: 회전 잠금 해제 (세로/가로 기기 방향에 따라 전환) -->
  <script>
    (function() {
      try {
        if (typeof screen !== 'undefined' && screen.orientation && typeof screen.orientation.unlock === 'function') {
          screen.orientation.unlock();
        }
      } catch (e) {}
    })();
  </script>
  <!-- Force cache clear - NO Service Worker registration -->
  <script>
    // Immediately clear ALL caches and service workers on every page load
    (function() {
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          registrations.forEach(function(registration) {
            registration.unregister();
          });
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          names.forEach(function(name) {
            caches.delete(name);
          });
        });
      }
    })();
  </script>
